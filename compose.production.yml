# Monitoring overlay: docker compose -f compose.yml -f compose.production.yml up -d
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [appnet]
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [appnet]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.9.1
    networks: [appnet]
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [appnet]
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    env_file: .env
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-openspots}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-openspots}?sslmode=disable"
    networks: [appnet]
    depends_on: [db]
    restart: unless-stopped

  redis_exporter:
    image: oliver006/redis_exporter:v1.77.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
    networks: [appnet]
    depends_on: [redis]
    restart: unless-stopped

  flower:
    build: .
    env_file: .env
    command: >
      sh -c 'celery -A openspots flower --port=5555
      --broker="$${CELERY_BROKER_URL}"
      --basic_auth="$${FLOWER_BASIC_AUTH}"'
    networks: [appnet]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on: [redis]
    restart: unless-stopped

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [appnet]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  appnet:
